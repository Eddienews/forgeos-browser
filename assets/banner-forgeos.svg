<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110d"/>
      <stop offset="0.55" stop-color="#1b1712"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffaa3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffaa3c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- hairline grid: editorial texture, very subtle -->
  <g stroke="#ece3d4" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- signal arcs: editorial motif, top-right -->
  <g fill="none" stroke="#ffaa3c" stroke-opacity="0.14" stroke-width="1.2">
    <path d="M 1040 60 A 60 60 0 0 1 1100 120"/>
    <path d="M 1020 40 A 80 80 0 0 1 1100 120"/>
    <path d="M 1000 20 A 100 100 0 0 1 1100 120"/>
  </g>
  <g fill="none" stroke="#ffaa3c" stroke-opacity="0.05" stroke-width="1.2">
    <path d="M 1060 20 A 100 100 0 0 1 1120 80"/>
    <path d="M 1040 0 A 120 120 0 0 1 1120 80"/>
  </g>

  <!-- amber signal line, left edge -->
  <rect x="0" y="0" width="4" height="630" fill="#ffaa3c" fill-opacity="0.85"/>

  <!-- wordmark top-left -->
  <circle cx="84" cy="64" r="5" fill="#ffaa3c"/>
  <text x="100" y="69" font-family="Consolas, Menlo, monospace" font-size="19" letter-spacing="7" fill="#ece3d4">FORGEOS</text>
  <text x="286" y="69" font-family="Consolas, Menlo, monospace" font-size="19" letter-spacing="7" fill="#9a8f7d">BROWSER</text>

  <!-- eyebrow -->
  <text x="84" y="196" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="5" fill="#ffaa3c">A PRIVATE, LOCAL-FIRST BROWSER</text>

  <!-- headline -->
  <text x="80" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#ece3d4" letter-spacing="1">ForgeOS Browser</text>

  <!-- amber rule -->
  <rect x="86" y="322" width="64" height="3" fill="#ffaa3c" fill-opacity="0.9"/>

  <!-- subheadline -->
  <text x="84" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#c9c0b2" letter-spacing="0.5">Built for humans — and prepared for trusted AI agents.</text>

  <!-- chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2.5" fill="#9a8f7d">
    <rect x="84" y="410" width="196" height="34" rx="3" fill="none" stroke="#ece3d4" stroke-opacity="0.16"/>
    <text x="100" y="432" fill="#ffaa3c">ZERO TELEMETRY</text>

    <rect x="292" y="410" width="150" height="34" rx="3" fill="none" stroke="#ece3d4" stroke-opacity="0.16"/>
    <text x="308" y="432" fill="#c9c0b2">MIT LICENSE</text>

    <rect x="454" y="410" width="120" height="34" rx="3" fill="none" stroke="#ece3d4" stroke-opacity="0.16"/>
    <text x="470" y="432" fill="#c9c0b2">OPEN SOURCE</text>
  </g>

  <!-- bottom hairline -->
  <line x1="0" y1="598" x2="1200" y2="598" stroke="#ece3d4" stroke-opacity="0.10"/>

  <!-- footer -->
  <text x="84" y="584" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="3" fill="#6e6557">V0.9.0</text>
  <text x="480" y="584" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2.5" fill="#6e6557">EDUCATIONAL PROTOTYPE · NOT A PRODUCTION BROWSER</text>
  <text x="1090" y="584" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2.5" fill="#6e6557" text-anchor="end">GITHUB.COM/EDDIENEWS/FORGEOS-BROWSER</text>
</svg>
