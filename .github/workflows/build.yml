name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    # PRs run the unit tests (fast feedback for contributors); packaging
    # stays tag-only (each release rebuilds all 5 targets).
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'results/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        arch: [x64, arm64]
        exclude:
          # electron-packager does not support win32 arm64
          - os: windows-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Map platform
        id: platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "plat=win32" >> $GITHUB_OUTPUT ;;
            macos-latest)   echo "plat=darwin" >> $GITHUB_OUTPUT ;;
            ubuntu-latest)  echo "plat=linux" >> $GITHUB_OUTPUT ;;
          esac

      - name: Package application
        if: github.event_name == 'push'  # tag releases package; PRs test only
        run: node scripts/package.js --platform=${{ steps.platform.outputs.plat }} --arch=${{ matrix.arch }}

      - name: Create portable archive
        if: github.event_name == 'push'
        run: node scripts/make-portable.js --platform=${{ steps.platform.outputs.plat }} --arch=${{ matrix.arch }}

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBrowserLab-${{ steps.platform.outputs.plat }}-${{ matrix.arch }}
          path: dist/ForgeBrowserLab-portable-${{ steps.platform.outputs.plat }}-${{ matrix.arch }}.zip
          if-no-files-found: warn

  release:
    name: Publish release downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: ForgeBrowserLab-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No packaged archives were produced."
            exit 1
          fi
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ForgeOS Browser $TAG_NAME" \
              --generate-notes
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
