name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    # PRs build and verify 5 target-OS archives (some cross-architecture).
    # Uploads and releases remain tag-only; PR archives are ephemeral.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'results/**'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        arch: [x64, arm64]
        exclude:
          # electron-packager does not support win32 arm64
          - os: windows-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Python checks ZIP CRCs on every target; QUIC deps remain Windows-only.
      - name: Setup Python for integrity and loopback QUIC fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test-only QUIC fixture dependency
        if: matrix.os == 'windows-latest' && matrix.arch == 'x64'
        shell: pwsh
        run: python -m pip install --target "$env:RUNNER_TEMP/forge-quic-site" aioquic==1.3.0

      # A source-only unit pass cannot establish renderer network confinement.
      # A failed Windows transport fixture blocks the entire release matrix.
      - name: Run isolated Electron transport and approval E2E
        if: matrix.os == 'windows-latest' && matrix.arch == 'x64'
        env:
          FORGE_FIXTURE_PYTHON: python
          FORGE_QUIC_SITE: ${{ runner.temp }}/forge-quic-site
          PYTHONPATH: ${{ runner.temp }}/forge-quic-site
        run: npm run test:e2e

      - name: Map platform
        id: platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "plat=win32" >> $GITHUB_OUTPUT ;;
            macos-latest)   echo "plat=darwin" >> $GITHUB_OUTPUT ;;
            ubuntu-latest)  echo "plat=linux" >> $GITHUB_OUTPUT ;;
          esac

      - name: Package application
        run: node scripts/package.js --platform=${{ steps.platform.outputs.plat }} --arch=${{ matrix.arch }}

      # Print only immediate vendor framework Resource names and entry types on
      # macOS PRs, never their contents or packaged bytes. Uploads stay tag-only.
      - name: Inventory macOS framework resource names and types
        if: github.event_name == 'pull_request' && matrix.os == 'macos-latest'
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const dir = "dist/ForgeBrowserLab-darwin-${{ matrix.arch }}/ForgeBrowserLab.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Resources"; const entries = fs.readdirSync(dir, { withFileTypes: true }).map(entry => [entry.name, entry.isDirectory() ? "directory" : entry.isFile() ? "file" : entry.isSymbolicLink() ? "symlink" : "other"]).sort((a, b) => a[0].localeCompare(b[0])); console.log("Electron Framework Resources entries:", JSON.stringify(entries));'

      - name: Create portable archive
        run: node scripts/make-portable.js --platform=${{ steps.platform.outputs.plat }} --arch=${{ matrix.arch }}

      - name: Verify ZIP integrity
        run: |
          python -c "import sys, zipfile; archive=sys.argv[1]; z=zipfile.ZipFile(archive); bad=z.testzip(); z.close(); print('ZIP integrity verified' if bad is None else 'Bad ZIP member: ' + bad); sys.exit(1 if bad else 0)" "dist/ForgeBrowserLab-portable-${{ steps.platform.outputs.plat }}-${{ matrix.arch }}.zip"

      - name: Verify target-OS portable archive
        run: node scripts/make-portable.js --verify-archive=dist/ForgeBrowserLab-portable-${{ steps.platform.outputs.plat }}-${{ matrix.arch }}.zip --platform=${{ steps.platform.outputs.plat }} --arch=${{ matrix.arch }} --verify-source

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBrowserLab-${{ steps.platform.outputs.plat }}-${{ matrix.arch }}
          path: dist/ForgeBrowserLab-portable-${{ steps.platform.outputs.plat }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish release downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout portable archive policy
        uses: actions/checkout@v4

      - name: Setup Node.js for portable archive policy
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install archive inspector for release validation
        run: npm ci --ignore-scripts

      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: ForgeBrowserLab-*
          path: release-assets
          merge-multiple: true

      - name: Validate release completeness and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            ForgeBrowserLab-portable-win32-x64.zip
            ForgeBrowserLab-portable-darwin-x64.zip
            ForgeBrowserLab-portable-darwin-arm64.zip
            ForgeBrowserLab-portable-linux-x64.zip
            ForgeBrowserLab-portable-linux-arm64.zip
          )
          shopt -s nullglob
          actual=(ForgeBrowserLab-portable-*.zip)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "Missing or unexpected release archive: expected ${#expected[@]}, got ${#actual[@]}" >&2
            exit 1
          fi
          for archive in "${expected[@]}"; do
            if [ ! -s "$archive" ]; then
              echo "Missing or empty release archive: $archive" >&2
              exit 1
            fi
            unzip -t "$archive" >/dev/null
            target="${archive#ForgeBrowserLab-portable-}"
            target="${target%.zip}"
            platform="${target%-*}"
            arch="${target##*-}"
            node ../scripts/make-portable.js "--verify-archive=$archive" "--platform=$platform" "--arch=$arch" --verify-source

          done
          # Completeness and accidental-corruption checks, not a digital signature.
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to replace its assets." >&2
            exit 1
          fi
          # Keep a failed upload in draft rather than publishing a partial release.
          gh release create "$TAG_NAME" "${assets[@]}" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "ForgeOS Browser $TAG_NAME" \
            --generate-notes \
            --verify-tag \
            --draft
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
