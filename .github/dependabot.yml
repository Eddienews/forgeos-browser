# Keeps the Chromium engine (shipped through Electron) and the build toolchain
# current. Dependabot checks every day and opens a pull request; the Build
# workflow then packages and verifies all five targets before a human merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Electron is the browser engine: always its own pull request, so a
      # Chromium security update is never held back by an unrelated bump.
      build-tooling:
        patterns: ["@electron/*", "yaml"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "ci"
